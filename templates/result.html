<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Result — ETL Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #1F2B37;
      --blue:   #4F76F6;
      --light:  #F9F9F9;
      --mint:   #77F2A1;
      --navy2:  #162028;
      --card:   #243342;
      --border: #2e4055;
      --muted:  #7a9bb5;
    }

    body {
      background: var(--navy);
      color: var(--light);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      border-bottom: 1px solid var(--border);
      background: var(--navy2);
    }
    .nav-brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--mint);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .back-link {
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--light); }

    /* MAIN */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* PAGE TITLE */
    .page-title {
      margin-bottom: 32px;
    }
    .page-title h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--light);
      margin-bottom: 8px;
    }
    .op-label {
      font-size: 14px;
      color: var(--muted);
    }
    .op-label strong { color: var(--mint); }

    /* STATS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--light);
    }
    .stat-value.mint { color: var(--mint); }
    .stat-value.blue { color: var(--blue); }

    /* ACTION BAR */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .action-bar h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--light);
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: var(--mint);
      color: var(--navy);
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-download:hover { opacity: 0.88; }
    .btn-download:active { transform: scale(0.97); }
    .btn-download svg { width: 16px; height: 16px; stroke: var(--navy); }

    /* TABLE WRAPPER */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .table-scroll {
      overflow-x: auto;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.data-table thead tr {
      background: var(--navy2);
    }
    table.data-table thead th {
      padding: 14px 18px;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.data-table tbody tr {
      border-bottom: 1px solid rgba(46, 64, 85, 0.5);
      transition: background 0.15s;
    }
    table.data-table tbody tr:last-child { border-bottom: none; }
    table.data-table tbody tr:hover { background: rgba(79, 118, 246, 0.06); }
    table.data-table tbody td {
      padding: 12px 18px;
      color: var(--light);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    .table-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr; }
      nav { padding: 16px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">⬡ ETL Studio</span>
  <a href="/" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to Dashboard
  </a>
</nav>

<div class="main">

  <div class="page-title">
    <h1>Cleaned Result</h1>
    <p class="op-label">
      File: <strong>{{ filename }}</strong> &nbsp;·&nbsp;
      Operation: {{ op_label | safe }}
    </p>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Original Rows</div>
      <div class="stat-value blue">{{ original_rows }}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Rows After Clean</div>
      <div class="stat-value mint">{{ new_rows }}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Rows Affected</div>
      <div class="stat-value">{{ rows_affected }}</div>
    </div>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar">
    <h2>Processed Data</h2>
    <a href="/download/{{ filename }}" class="btn-download">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download CSV
    </a>
    <form action="/upload-to-db/{{ filename }}" method="POST">
  <button type="submit" class="btn-download">Upload to Database</button>

</form>
  </div>

   


  <!-- TABLE -->
  <div class="table-wrap">
    <div class="table-scroll">
      {{ table | safe }}
    </div>
    <div class="table-footer">{{ new_rows }} rows · {{ columns }} columns</div>
  </div>

</div>

</body>
</html>
